<!DOCTYPE html>
<html lang="en" xmlns:v-bind="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://unpkg.com/vue/dist/vue.js"></script>
    <style>
        .class1{
            background: #444;
            color: #eee;
        }
    </style>
</head>
<body>
<div id="vue_det">
    <h1>site:{{site}}</h1>
</div>
<div id="app" >
    <div v-html="message"></div>
</div>
<div id="app2">
    <label for="r1">修改颜色</label><input type="checkbox" v-model="use" id="r1">
    <br><br>
    <div v-bind:class="{'class1':use}">
        v-bind:class 指令
    </div>
</div>
<div id="app3">
    {{5+10}}<br>
    {{ok?'真棒！':'打错啦'}}<br>
    {{message.split('').reverse().join('')}}<br>
    debugger
    <div v-bind:id="'list-'+id">菜鸟教程</div>
</div>
<div id="app4">
    <p>{{message}}</p>
    <input v-model="message">
</div>
<!--下拉框-->
<div id="app5">
    <select v-model="selected">
        <option value="A被选">A</option>
        <option value="B被选">B</option>
        <option value="C被选">C</option>
    </select>
    <span>Selected: {{ selected }}</span>
</div>
<script type="text/javascript">
    new Vue({
        el: '#app5',
        data: {
            selected: ''
        }
    });
    new Vue({
        el:'#app4',
        data:{
            message:'Runoob!'
        }
    })
    new Vue({
        el:"#app3",
        data:{
            ok:true,
            message: "RUNOOB",
            id:1
        }
    })
    new Vue({
        el:"#app2",
        data:{
            use:false
        }
    });
    var vm=new Vue({
        el:'#vue_det',
        data:{
            site:"hello vue.js"
        },
    });
    new Vue({
        el:"#app",
        data: {
            message:'<h1>菜鸟教程</h1>'
        }
    })
</script>
</body>
</html>
